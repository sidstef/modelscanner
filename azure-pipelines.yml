trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: hl_docker_registry  

jobs:
- job: ScanModelsInRepo
  steps:
  - checkout: self
    displayName: 'Check out the repository to the runner'

  - script: |
      echo "$(HL_CONTAINER_REGISTRY_SECRET)" | docker login quay.io -u "$(HL_CONTAINER_REGISTRY_USER)" --password-stdin
    displayName: 'Login to quay.io'

  - script: |
      scan_results=$(docker run --rm --entrypoint /modelscan/cli -v $(Build.SourcesDirectory)/Models:/files-to-scan quay.io/hiddenlayer/distro-cli-modelscanner:24.6.1 --input /files-to-scan)
      echo "##vso[task.setvariable variable=scan_results;isOutput=true]$scan_results"
    displayName: 'Scan models'
    name: scan_models

  - script: |
     scan_results=$(echo '[{"detections":[{"description":"This detection rule was triggered by the presence of a function or library that can be used to execute code. Offending module / function: eval / exec / system.","message":"pickle-bytes_builtins_eval","severity":"MALICIOUS"}],"end_time":1723663973896,"file_path":"file://files-to-scan/eval.pkl","results":{"md5":"1b4797b953564fd8dc4399b159e96767","pickle_header":{"pickle_version":"4","type":"pickle"},"pickle_modules":["builtins.eval"],"sha256":"7a75f4b5c61ad06470ba932070c200e996b77c83abd5d92c69296ecaf9d3ec97","subtype":[],"tlsh":"6ab09b226c5561c4c417557dd2b5437481914c4422f53051c1e9c4461c55976502d078","type":"pickle"},"scan_id":"7a75f4b5c61ad06470ba932070c200e996b77c83abd5d92c69296ecaf9d3ec97","start_time":1723663973894,"status":"done"}]')
     echo $scan_results > $(Pipeline.Workspace)/scan_results.json
     cat $(Pipeline.Workspace)/scan_results.json | jq
    displayName: 'Scan results'

  - script: |
      if echo "$(scan_models.scan_results)" | grep -q 'MALICIOUS'; then
        echo 'HiddenLayer ModelScanner detected malicious content'
        exit 1
      elif echo "$(scan_models.scan_results)" | grep -q 'SUSPICIOUS'; then
        echo 'HiddenLayer ModelScanner detected suspicious content'
        exit 1
      fi
    displayName: 'Fail job if detection'
