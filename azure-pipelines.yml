trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: hl_docker_registry  

jobs:
- job: ScanModelsInRepo
  steps:
  - checkout: self
    displayName: 'Check out the repository to the runner'

  - script: |
      echo "$(HL_CONTAINER_REGISTRY_SECRET)" | docker login quay.io -u "$(HL_CONTAINER_REGISTRY_USER)" --password-stdin
    displayName: 'Login to quay.io'
    
  - script: |
      scan_results=$(docker run --rm --entrypoint /modelscan/cli -v $(Build.SourcesDirectory)/Models:/files-to-scan quay.io/hiddenlayer/distro-cli-modelscanner:24.6.1 --input /files-to-scan)
      echo "scan_results=$scan_results" > $(Pipeline.Workspace)/scan_results.txt
      echo "##vso[task.setvariable variable=scan_results;isOutput=true]$scan_results" >> $(Pipeline.Workspace)/scan_results.txt
    displayName: 'Scan models'
    name: scan_models

  - script: |
      echo "$(scan_models.scan_results)" | jq
    displayName: 'Scan results'
    env:
      scan_results: $(scan_models.scan_results)

  - script: |
      echo 'HiddenLayer ModelScanner detected malicious content'
      exit 1
    condition: and(succeeded(), contains('$(scan_models.scan_results)', 'MALICIOUS'))
    displayName: 'Fail job if MALICIOUS detection'

  - script: |
      echo 'HiddenLayer ModelScanner detected suspicious content'
      exit 1
    condition: and(succeeded(), contains('$(scan_models.scan_results)', 'SUSPICIOUS'))
    displayName: 'Fail job if SUSPICIOUS detection'
